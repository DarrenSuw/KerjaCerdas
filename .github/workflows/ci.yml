# ─────────────────────────────────────────────────────────────────────────────
# CI Pipeline — KerjaCerdas
#
# Triggers : every push to `main` and every Pull Request targeting `main`
# Skips    : tag pushes (release.yml handles those)
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main]
    tags-ignore: ["**"]   # release.yml handles tag pushes
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "24"

# Cancel in-flight runs for the same branch/PR to save runner minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Gate 1: Backend Code Quality ─────────────────────────────────────────────
  quality-backend:
    name: "Backend · Lint & Audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install backend (dev)
        run: pip install -e "backend/.[dev]"

      - name: Ruff lint
        run: ruff check backend/app/

      - name: pip-audit (dependency CVE scan)
        run: pip-audit --requirement <(pip freeze) --skip-editable

  # ── Gate 2: Frontend Code Quality ────────────────────────────────────────────
  quality-frontend:
    name: "Frontend · Lint & Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: cd frontend && npm ci --legacy-peer-deps --registry https://registry.npmjs.org/
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

      # NOTE: there is deliberately no ESLint step. The previous one ran
      # `npm run lint --if-present || true` against a repo with no eslint
      # config, no eslint dependency and no lint script — `--if-present` exits
      # 0 on a missing script, so it always passed without linting anything.
      # A green check that verifies nothing is worse than no check. Configuring
      # ESLint across the frontend is tracked separately; until then this job
      # claims only what it actually does.

      - name: Vitest (unit)
        run: cd frontend && npm test

      - name: Vite build check (validates all imports and bundling)
        run: cd frontend && npm run build
        env:
          VITE_API_URL: http://localhost:8000

  # ── Gate 3: Backend Unit Tests ────────────────────────────────────────────────
  test-unit:
    name: "Backend · Unit Tests"
    runs-on: ubuntu-latest
    needs: [quality-backend]
    env:
      DEMO_MODE: "true"
      GEMINI_API_KEY: ""
      DATABASE_URL: "sqlite+aiosqlite:///./test.db"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install backend (dev)
        run: pip install -e "backend/.[dev]"

      - name: Run unit tests with coverage
        run: |
          cd backend
          python -m pytest tests/unit/ -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=30 \
            -x --timeout=60

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage.xml
          retention-days: 7

  # ── Gate 4: Integration Tests (pgvector + Alembic migration) ─────────────────
  # NON-GATING (continue-on-error). This is the ONLY job that runs `alembic
  # upgrade head` against a real PostgreSQL, and it has already caught a P1 in
  # this branch: two ORM tables (`otps`, `query_embeddings`) that no migration
  # ever created, so a migration-built database silently had nowhere to write
  # email OTPs. Because it cannot fail the build, a future migration break can
  # merge green. Worth making gating once it has a stable history — that is a
  # branch-protection decision for the repo owner, not a code change.
  test-integration:
    name: "Backend · Integration Tests"
    runs-on: ubuntu-latest
    needs: test-unit
    continue-on-error: true
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: kerjacerdas_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:testpass@localhost:5432/kerjacerdas_test
      DEMO_MODE: "false"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install backend (dev)
        run: pip install -e "backend/.[dev]"

      - name: Run Alembic migrations against test DB
        run: python -m alembic -c backend/alembic.ini upgrade head

      - name: Run integration tests
        run: |
          cd backend
          python -m pytest tests/integration/ -v -x --timeout=60; EC=$?
          if [ $EC -eq 5 ]; then
            echo "::notice::No integration tests collected yet — exit 5 is OK"
            exit 0
          fi
          exit $EC

  # ── Gate 5: Latency Benchmark (informational only) ───────────────────────────
  perf-benchmark:
    name: "Backend · Latency Benchmark"
    runs-on: ubuntu-latest
    needs: test-unit
    continue-on-error: true
    env:
      DEMO_MODE: "true"
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install backend (core only)
        run: pip install -e "backend/."

      - name: Run matching benchmark
        run: python -m scripts.benchmark_matching --manual-seconds-per-cv 30
